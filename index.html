<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a0b14">
  <title>Flappy Poop</title>
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Phaser's CDN: the connection opens while the page parses (plan 35, 1.2). -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <!-- The module graph is four levels deep, and a browser only learns a level once the one above has arrived: these start the big first-run modules at once (plan 35, 2.4). The hrefs are exactly the URLs the imports use (bare, no ?v=), or the preload is wasted. -->
  <link rel="modulepreload" href="src/main.js">
  <link rel="modulepreload" href="src/config.js">
  <link rel="modulepreload" href="src/logic.js">
  <link rel="modulepreload" href="src/i18n.js">
  <link rel="modulepreload" href="src/scenes/Boot.js">
  <link rel="modulepreload" href="src/scenes/Play.js">
  <!-- ?v= on the icons: browsers cache favicons and manifest icons by URL for a long time; bump it when the icon art changes. -->
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=2">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #1a0b14;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game {
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      touch-action: none;
    }

    /* The loading splash (src/splash.js). Colours are tokens so a themed splash (data-theme) only
       overrides them; tests/html.test.js pins the defaults. Motion is CSS so it runs before any script. */
    #splash {
      --splash-bg: #ead0a9;
      --splash-ink: #4a2c14;
      --splash-brown: #7a4a21;
      --splash-track: rgba(122, 74, 33, 0.18);
      --splash-card: #f6e6cc;
      --splash-new: #c94f6d;
      --splash-idle: #b79a77;
      --splash-glow: 255, 196, 64;
      position: fixed;
      inset: 0;
      z-index: 10;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background: var(--splash-bg);
      color: var(--splash-ink);
      font-family: sans-serif;
      transition: opacity var(--splash-fade, 200ms) ease-out;
    }
    #splash.leaving { opacity: 0; }
    .splash-col {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(16px, 4vh, 32px);
    }
    .splash-hero {
      position: relative;
      flex: none;
      width: min(52vw, 30vh, 220px);
      aspect-ratio: 1;
    }
    .splash-ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .splash-ring circle { fill: none; stroke-width: 7; }
    .splash-track { stroke: var(--splash-track); }
    /* r = 54: the circumference is 339.3. The ring only fills: src/splash.js sets the offset every
       frame (ringTarget / ringStep), so it starts as the empty track. */
    .splash-arc {
      stroke: var(--splash-brown);
      stroke-linecap: round;
      stroke-dasharray: 339.3;
      stroke-dashoffset: 339.3;
    }
    /* top 13 %: at the bottom of its bob the art stays inside the ring (tests/html.test.js measures it). */
    .splash-poop {
      position: absolute;
      left: 18%;
      top: 13%;
      width: 64%;
      height: 64%;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
      animation: splash-bob 0.7s ease-in-out infinite alternate;
    }
    .splash-body {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      visibility: hidden;
    }
    #splash.live .splash-body { visibility: visible; }
    /* ‹ card ›: the arrows sit on the card's vertical centre. */
    .splash-deck {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #splash-note {
      box-sizing: border-box;
      flex: 1;
      min-width: 0;
      padding: 12px 14px 14px;
      border-radius: 18px;
      background: var(--splash-card);
      box-shadow: 0 2px 0 rgba(74, 44, 20, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }
    #splash-note .label {
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--splash-brown);
      color: var(--splash-card);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    #splash-note[data-kind="feature"] .label { background: var(--splash-new); color: #ffffff; }
    /* The sprite (or the emoji when a card has none): a fixed box, so nothing moves while it loads. */
    #splash-note .art {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      font-size: 34px;
      line-height: 1;
    }
    /* An emoji card may pair glyphs (the streak card's 📅🔥, plan 36): the box widens, never taller. */
    #splash-note .art[data-kind="glyph"] { width: auto; min-width: 48px; }
    #splash-note .art img, #splash-note .art .sheet {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
      animation: splash-fade-in 150ms ease-out both;
    }
    #splash-note .art .sheet { background-repeat: no-repeat; background-position: 0 0; }
    /* Every card's text in one grid cell, only the current one visible: the cell is as tall as the
       tallest card at this width, so the card (and the arrows on its centre) never jumps. A shorter
       text sits at the top, under its picture. */
    #splash-note .texts {
      display: grid;
      width: 100%;
      font-size: clamp(15px, 4.2vw, 18px);
      line-height: 1.35;
    }
    #splash-note .text {
      grid-area: 1 / 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      visibility: hidden;
    }
    #splash-note .text.on { visibility: visible; }
    #splash-note.slide-next > * { animation: splash-in-next var(--splash-slide, 250ms) ease-out both; }
    #splash-note.slide-prev > * { animation: splash-in-prev var(--splash-slide, 250ms) ease-out both; }
    #splash button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
    #splash button:focus { outline: none; }
    #splash button:focus-visible { outline: 3px solid var(--splash-ink); outline-offset: 3px; }
    .splash-arrow {
      flex: none;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 2px solid var(--splash-brown);
      border-radius: 50%;
      background: transparent;
      color: var(--splash-brown);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .splash-arrow:disabled { opacity: 0.35; cursor: default; }
    .splash-arrow svg { width: 20px; height: 20px; }
    .splash-arrow path { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    /* Continue on its own row, under the card. */
    #splash-continue {
      flex: none;
      width: min(260px, 100%);
      height: 52px;
      border: none;
      border-radius: 26px;
      background: var(--splash-idle);
      color: rgba(255, 255, 255, 0.85);
      font-size: 18px;
      font-weight: 700;
      cursor: default;
      transition: background 300ms ease-out, color 300ms ease-out;
    }
    /* Ready: the glow fades in, then breathes until Continue is pressed. It never shows before. */
    #splash.ready #splash-continue {
      background: var(--splash-brown);
      color: #ffffff;
      cursor: pointer;
      animation: splash-glow-in 400ms ease-out both, splash-glow 0.8s ease-in-out 400ms infinite alternate;
    }
    /* Couldn't load (plan 35, 1.2): Phaser came from neither the CDN nor assets/vendor/, or the game's own
       code failed before it could start. The ring and the poop stop and Continue becomes the retry
       (src/splash.js, splashFailed). */
    #splash.failed .splash-arc { stroke: var(--splash-new); }
    #splash.failed .splash-poop { animation: none; filter: grayscale(0.7); opacity: 0.6; }
    #splash.failed #splash-continue { background: var(--splash-new); color: #ffffff; cursor: pointer; }
    /* Without src/splash.js (that module failed too): no words, a full red ring around a ↻, and a tap
       anywhere reloads (the inline trap below). */
    #splash.failed:not(.live) { cursor: pointer; }
    #splash.failed:not(.live) .splash-arc { stroke-dashoffset: 0; }
    #splash.failed:not(.live) .splash-poop { opacity: 0.2; }
    #splash.failed:not(.live) .splash-hero::after {
      content: '\21BB';
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: clamp(48px, 14vw, 88px);
      font-weight: 700;
      color: var(--splash-new);
    }
    @keyframes splash-bob { from { transform: translateY(-5%); } to { transform: translateY(5%); } }
    @keyframes splash-in-next { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
    @keyframes splash-in-prev { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
    @keyframes splash-fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes splash-glow-in {
      from { box-shadow: 0 0 0 0 rgba(var(--splash-glow), 0); }
      to { box-shadow: 0 0 22px 6px rgba(var(--splash-glow), 0.85); }
    }
    @keyframes splash-glow {
      from { box-shadow: 0 0 22px 6px rgba(var(--splash-glow), 0.85); }
      to { box-shadow: 0 0 10px 2px rgba(var(--splash-glow), 0.35); }
    }
    /* A phone on its side: poop and ring left, the card row and Continue stacked right. */
    @media (orientation: landscape) and (max-height: 520px) {
      .splash-col { flex-direction: row; max-width: 820px; gap: 24px; }
      .splash-hero { width: min(50vh, 200px); }
      .splash-body { flex: 1; min-width: 0; gap: 12px; }
      #splash-note .texts { font-size: 15px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-poop { animation: none; }
      #splash-note.slide-next > *, #splash-note.slide-prev > * { animation-name: splash-fade-in; }
      #splash.ready #splash-continue { animation: splash-glow-in 400ms ease-out both; }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <!-- The loading splash (src/splash.js, TUNING.splash): the poop and the ring's track paint at once;
       the module fills the ring and brings the note card, ‹ › and Continue. Boot's progress fills
       the ring, then Continue starts Play. No words here: every one comes from src/i18n.js. -->
  <div id="splash" data-theme="default" aria-busy="true">
    <div class="splash-col">
      <div class="splash-hero">
        <svg class="splash-ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="splash-track" cx="60" cy="60" r="54"></circle>
          <circle class="splash-arc" cx="60" cy="60" r="54"></circle>
        </svg>
        <img class="splash-poop" src="assets/poop.png" alt="" draggable="false">
      </div>
      <div class="splash-body">
        <div class="splash-deck">
          <button id="splash-prev" class="splash-arrow" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
          <div id="splash-note"><span class="label"></span><span class="art"></span><span class="texts"></span></div>
          <button id="splash-next" class="splash-arrow" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
        </div>
        <button id="splash-continue" type="button" disabled></button>
      </div>
    </div>
  </div>
  <!-- First of all (plan 35, 1.1 and 1.2): the error trap and Phaser's loader, in window.__flappyBoot.
       Errors from the game's own code are kept (the last one in memory only, for a bug report) and shown:
       on the error card once the game exists (src/ui/errorCard.js), else on the splash's failed state.
       Phaser comes from the CDN tag below; if it errors, or Phaser is still missing after phaserWaitMs
       (a stalled request never fires onerror), the vendored copy in assets/vendor/ loads instead. The
       first copy to arrive is kept. src/phaserReady.js holds main.js and every scene until then. -->
  <script>
    (function (w, d) {
      var B = (w.__flappyBoot = { last: '', count: 0, failed: false, card: null });
      var origin = w.location.origin;
      var phaserWaitMs = 6000;
      // The stack alone when it holds the error's own message (Chrome's message reads "Uncaught Error: x"
      // over a stack that starts "Error: x"); else the message, then any stack.
      var text = function (msg, err) {
        var stack = err && err.stack ? String(err.stack) : '';
        var own = err && err.message ? String(err.message) : '';
        var m = String(msg || own || err || 'error');
        return (stack && stack.indexOf(own || m) >= 0 ? stack : m + (stack ? '\n' + stack : '')).slice(0, 2000);
      };
      // The splash's failed state: src/splash.js's words, or with no module the bare ↻ (index.html's CSS).
      B.fail = function (why) {
        if (B.failed) return;
        B.failed = true;
        if (!B.last) B.last = String(why);
        var bare = function () {
          var s = d.getElementById('splash');
          if (!s) return;
          s.classList.add('failed');
          s.removeAttribute('aria-busy');
          s.addEventListener('click', function () { w.location.reload(); });
        };
        import('./src/splash.js').then(function (m) { if (!m.splashFailed(d, w)) bare(); }, bare);
      };
      // soft: an unhandled rejection, shown only when the game loop has stopped (errorCard decides).
      B.report = function (t, soft) {
        B.last = t;
        B.count += 1;
        if (B.card) B.card(t, soft);
        else if (!soft) B.fail(t);
      };
      // Capture: a script that fails to load fires on its element, not the window.
      w.addEventListener('error', function (e) {
        var el = e.target;
        if (el && el !== w) {
          // One of ours: before the game, the failed splash; after it, the card. A script marked
          // data-own-error (the online client, src/supabaseLoader.js) reports its own failure.
          var own = el.hasAttribute && el.hasAttribute('data-own-error');
          if (el !== local && !own && el.tagName === 'SCRIPT' && el.src && el.src.indexOf(origin) === 0) {
            if (B.card) B.report('could not load ' + el.src, false);
            else B.fail('could not load ' + el.src);
          }
          return; // the CDN's Phaser (B.cdn), the vendored copy (its onerror, after this), or an image or sound (Boot's loader)
        }
        if (e.filename && e.filename.indexOf(origin) !== 0) return; // an extension, the CDN
        if (!e.filename && e.message === 'Script error.') return; // cross-origin: no detail to show
        B.report(text(e.message, e.error), false);
      }, true);
      w.addEventListener('unhandledrejection', function (e) {
        B.report(text('', e.reason), true);
      });

      var resolve;
      var kept = null;
      var local = null; // the vendored copy's script, once asked for: its own onerror reports it
      B.phaser = new Promise(function (r) { resolve = r; });
      // The first copy is kept, read-only: a copy that arrives later runs but cannot replace it
      // (Phaser's UMD wrapper is sloppy code, so its assignment fails silently).
      var have = function () {
        if (!kept && w.Phaser) {
          kept = w.Phaser;
          try {
            Object.defineProperty(w, 'Phaser', { value: kept, writable: false, configurable: true });
          } catch (err) {
            /* the copy stays writable; the race is rare */
          }
          resolve(kept);
        }
        return Boolean(kept);
      };
      var fallback = function () {
        if (have() || local) return;
        var s = (local = d.createElement('script'));
        s.src = 'assets/vendor/phaser.min.js?v=4.2.1';
        s.onload = function () { if (!have()) B.fail('no Phaser in assets/vendor/'); };
        s.onerror = function () { if (!have()) B.fail('could not load Phaser'); };
        d.head.appendChild(s);
      };
      // The CDN tag's load or error.
      B.cdn = function (loaded) {
        if (!loaded || !have()) fallback();
      };
      w.setTimeout(fallback, phaserWaitMs);
    })(window, document);
  </script>
  <!-- Before Phaser: a dynamic import runs during the Phaser download, so the cards show during that
       wait. Boot imports the same module and finds the splash started. -->
  <script>
    import('./src/splash.js').then((m) => m.startSplash(document, window)).catch(() => {});
  </script>
  <!-- async: a stalled CDN must not hold the page; src/phaserReady.js orders the modules instead. -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js" async onload="__flappyBoot.cdn(true)" onerror="__flappyBoot.cdn(false)"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
