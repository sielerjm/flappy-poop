name: Card report
description: A quiz card in education mode is wrong, unclear or out of date
title: "[Card] "
labels: ["card"]
body:
  - type: input
    id: card-id
    attributes:
      label: Card
      description: The code in the card's top-left corner (e.g. ST-03). It is filled in when you come from the 🚩 on the card.
      placeholder: ST-03
    validations:
      required: true
  - type: textarea
    id: whats-wrong
    attributes:
      label: What is wrong?
      description: The question, an answer or the explanation, and what it should say instead.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: Optional. A paper, textbook or link that supports the correction.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Game version
      description: Shown on About / Settings (e.g. v0.16.1). It is filled in when you come from the 🚩 on the card.
      placeholder: v0.16.1
    validations:
      required: false
